<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <!-- Some info for search engines -->
  <meta name="description" content="Social links profile layout. The challenge from frontendmentor.io. In layout there are profile of a woman, with links to other sites.">
  <meta name="keywords" content="HTML, CSS, layout, HTML CSS layout, responive layout, responsive design, adaptive layout, frontendmentor challenge">

  <!-- Adding CSS files and necessary content -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./normalize.css">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./style.css"> 
  
  <title>Social links profile</title>
</head>
<body>
  <main>
    <article>
      <section class="section-heading">
        <img src="./assets/images/avatar-jessica.jpeg" alt="The avatar of Jessica Randall.">
        <h1>Jessica Randall</h1>
        <p>London, United Kingdom</p>
      </section>
      <p class="description-text">"Front-end developer and avid reader."</p>

      <section class="section-list">
        <a href="https://github.com">
          <section>
            <p>GitHub</p>
          </section>
        </a>
        <a href="https://frontendmentor.io">
          <section>
            <p>Frontend Mentor</p>
          </section>
        </a>
        <a href="https://linkedin.com">
          <section>
            <p>LinkedIn</p>
          </section>
        </a>
        <a href="https://x.com">
          <section>
            <p>Twitter</p>
          </section>
        </a>
        <a href="https://instagram.com">
          <section>
            <p>Instagram</p>
          </section>
        </a>
      </section>
    </article>
  </main>
  <footer>
    Challenge by <a href="https://www.frontendmentor.io/challenges/social-links-profile-UG32l9m6dQ" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Redbegoon" target="_blank">redbegoon</a>.
  </footer>
</body>
</html>
